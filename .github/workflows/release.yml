name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  LMCLEAN_VERSION: 0.1.${{ github.run_number }}
  # Published @lmctl-ai/lmctl (lmscript compiler) used to build the examples.
  LMCTL_VERSION: 0.2.450
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, label: linux-arm64, ext: ''}
          - {os: macos-15, label: macos-arm64, ext: ''}
          - {os: macos-15-intel, label: macos-x64, ext: ''}
          - {os: windows-2022, label: windows-x64, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # dslvm is pinned by git rev in Cargo.toml, so no side-by-side
      # lmcode-rust checkout is needed; cargo fetches the exact pinned
      # runtime during the locked build.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # Rule packs are lmscript drivers (`lmscript examples/NAME.lms HOST`):
      # the compiler builds each program and launches the host via run_lmcode.
      - name: Install compiler from npm
        run: |
          npm install --prefix "$RUNNER_TEMP/lmctl" "@lmctl-ai/lmctl@$LMCTL_VERSION"
          echo "$RUNNER_TEMP/lmctl/node_modules/.bin" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "LMSCRIPT_BIN=$RUNNER_TEMP/lmctl/node_modules/.bin/lmscript.cmd" >> "$GITHUB_ENV"
          else
            echo "LMSCRIPT_BIN=$RUNNER_TEMP/lmctl/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          fi
          echo "Using @lmctl-ai/lmctl@$LMCTL_VERSION"
      # REST server integration tests: protocol tests plus every example rule
      # pack (clean-tmp, clean-build-dirs, clean-ignore, clean-stale-build-dirs
      # and the multi-program serve-all) driven through the REST API.
      # LMCLEAN_REQUIRE_EXAMPLES=1 turns a missing compiler into a failure
      # instead of a silent skip.
      - name: Server integration tests (all examples)
        env:
          LMCLEAN_REQUIRE_EXAMPLES: '1'
        run: cargo test --locked --test server -- --test-threads=1
      # The full gate: unit tests, release build, every example end to end
      # (dry-run/exec/trash/restore/params/ignore), exit-code protocol, R42 flags.
      - name: Build and test
        env:
          LMCLEAN_REQUIRE_EXAMPLES: '1'
        run: |
          bash test.sh
          [[ "$(target/release/lmclean --version | tr -d '\r')" == "lmclean $LMCLEAN_VERSION" ]]
          mkdir -p dist
          cp 'target/release/lmclean${{ matrix.ext }}' 'dist/lmclean-${{ matrix.label }}${{ matrix.ext }}'
      # Black-box end-to-end run over real HTTP (curl): create fake files,
      # launch lmclean, query it several ways, preview and perform deletes,
      # shut down and check the exit; then check the idle-timeout exit.
      - name: End-to-end server smoke test
        run: bash tests/e2e-server.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish tested binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="v$LMCLEAN_VERSION"
          cp LICENSE dist/
          (cd dist && sha256sum * > SHA256SUMS)
          if gh release view "$tag" --json targetCommitish --jq .targetCommitish > existing-target.txt 2>/dev/null; then
            [[ "$(cat existing-target.txt)" == "$GITHUB_SHA" ]]
            echo "Release $tag already published for this commit."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest --title "$tag" --notes 'Automatically built and tested on Linux x64/arm64, macOS x64/arm64 and Windows x64: the full lmclean gate (cargo unit tests, REST server integration tests over every example, release build, host-flag cutover check, example rule packs end to end through lmscript, --version/--lmcode-schema/--lmcode-signatures checks) passed on every platform.'
          fi
