name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  LMCLEAN_VERSION: 0.1.${{ github.run_number }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, label: linux-arm64, ext: ''}
          - {os: macos-15, label: macos-arm64, ext: ''}
          - {os: macos-15-intel, label: macos-x64, ext: ''}
          - {os: windows-2022, label: windows-x64, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # dslvm is pinned by git rev in Cargo.toml, so no side-by-side
      # lmcode-rust checkout is needed; cargo fetches the exact pinned
      # runtime during the locked build.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # LMCLEAN_SKIP_EXAMPLES=1: the released lmscript compiler removed
      # `savedsl` (public .dslb export), so the rule-entry examples cannot be
      # compiled in CI. The skip keeps cargo tests, the release build, the
      # host-flag cutover check and the
      # --version/--lmcode-schema/--lmcode-signatures checks; the full
      # end-to-end gate (dry-run/exec/trash/restore) runs locally where a
      # savedsl-capable compiler and prebuilt bytecode exist.
      - name: Build and test
        run: |
          LMCLEAN_SKIP_EXAMPLES=1 bash test.sh
          [[ "$(target/release/lmclean --version | tr -d '\r')" == "lmclean $LMCLEAN_VERSION" ]]
          mkdir -p dist
          cp 'target/release/lmclean${{ matrix.ext }}' 'dist/lmclean-${{ matrix.label }}${{ matrix.ext }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish tested binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="v$LMCLEAN_VERSION"
          cp LICENSE dist/
          (cd dist && sha256sum * > SHA256SUMS)
          if gh release view "$tag" --json targetCommitish --jq .targetCommitish > existing-target.txt 2>/dev/null; then
            [[ "$(cat existing-target.txt)" == "$GITHUB_SHA" ]]
            echo "Release $tag already published for this commit."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest --title "$tag" --notes 'Automatically built and tested on Linux x64/arm64, macOS x64/arm64 and Windows x64: the lmclean gate (cargo unit tests, release build, host-flag cutover check, --version/--lmcode-schema/--lmcode-signatures checks) passed on every platform. The dry-run/exec/trash/restore end-to-end sections of the gate require an lmscript compiler with .dslb export (savedsl), which the released compiler no longer provides; they run locally via test.sh and are skipped in CI (LMCLEAN_SKIP_EXAMPLES=1).'
          fi
